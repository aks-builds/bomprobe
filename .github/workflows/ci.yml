name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CLI smoke test
        run: |
          echo '{"bomFormat":"CycloneDX","specVersion":"1.4","components":[{"name":"test","version":"1.0.0","type":"library"}]}' > /tmp/sbom.json
          node bin/bomprobe.js /tmp/sbom.json --format json
          node bin/bomprobe.js /tmp/sbom.json --format text
          node bin/bomprobe.js /tmp/sbom.json --format markdown
