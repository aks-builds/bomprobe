[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bomprobe"
version = "1.0.0"
description = "SBOM quality auditor for CycloneDX and SPDX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Aditya S."},
]
keywords = [
    "sbom", "cyclonedx", "spdx", "bom", "software-bill-of-materials",
    "supply-chain", "security", "audit", "ntia", "compliance",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/aks-builds/bomprobe"
Repository = "https://github.com/aks-builds/bomprobe"
Issues = "https://github.com/aks-builds/bomprobe/issues"

[project.scripts]
bomprobe-py = "bomprobe.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
